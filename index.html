<!doctype html>
<html lang="en" class="dark" style="background-color: #07090e; color: #f1f5f9; min-height: 100%;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GB STUDY - Official Learning Portal</title>
    <meta name="description" content="Official learning portal for GB STUDY batches, video lectures, and PDF notes." />
    <meta property="og:title" content="GB STUDY - Official Learning Portal" />
    <meta property="og:description" content="Official learning portal for GB STUDY batches, video lectures, and PDF notes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/assets/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" crossorigin href="/assets/index-portal.css">
    <style>
      html, body {
        min-height: 100vh;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        color: #f1f5f9 !important;
        background-color: #07090e !important;
      }
      #initial-loader {
        color: #f1f5f9;
        background: #07090e;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 16px;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 9999;
      }
      .loader-logo {
        object-fit: cover;
        border-radius: 50%;
        width: 64px;
        height: 64px;
        box-shadow: 0 0 24px rgba(99, 102, 241, 0.45);
        border: 2px solid rgba(255, 255, 255, 0.1);
      }
      .spinner-ring {
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        border-radius: 50%;
        width: 38px;
        height: 38px;
        animation: .8s linear infinite spin;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#07090e] text-[#f1f5f9] antialiased selection:bg-[#6366f1]/30 selection:text-[#a5b4fc]" style="background-color: #07090e; color: #f1f5f9;">
    <div id="root">
      <div id="initial-loader">
        <img src="/assets/logo.png" alt="GB STUDY Logo" class="loader-logo" />
        <div class="spinner-ring"></div>
        <div style="font-weight: 700; font-size: 16px; letter-spacing: -0.01em; color: #e2e8f0;">
          GB STUDY
        </div>
      </div>
    </div>
    <script type="module" crossorigin src="/assets/index-portal.js"></script>
  </body>
</html>
